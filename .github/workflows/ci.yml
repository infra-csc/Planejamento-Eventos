name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Testes (domínio + integração com PGlite em memória)
        run: npm test
      - name: Migrações, seed e teste de fumaça (PGlite)
        run: npm run setup && npm run test:smoke
      - name: Build de produção
        run: npm run build

  # Mesmos fluxos contra um PostgreSQL de verdade (o do Replit é Postgres, não PGlite): migrações,
  # seed, teste de fumaça e ida-e-volta do backup. Não bloqueia o merge enquanto amadurece.
  # Os testes do Vitest continuam no PGlite em memória (os arquivos de teste forçam PGLITE_DATA_DIR).
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: npe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/npe
      SEED_DEMO: "true"
      BACKUP_DIR: /tmp/npe-backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Migrações, seed e teste de fumaça (Postgres)
        run: npm run setup && npm run test:smoke
      - name: Backup e restauração só de dados (sem pg_dump)
        run: |
          BACKUP_MODO=dados npm run backup
          npm run restaurar -- "$(ls -1 "$BACKUP_DIR"/npe-backup-*-dados.sql.gz | tail -n 1)" --force
      - name: Backup e restauração completos (pg_dump/psql do runner)
        run: |
          sudo apt-get install -y -qq postgresql-client-16 >/dev/null 2>&1 || true
          BACKUP_MODO=pg_dump npm run backup
          npm run restaurar -- "$(ls -1t "$BACKUP_DIR"/npe-backup-*.sql.gz | grep -v -- -dados | head -n 1)" --force

  # Fluxos ponta a ponta no navegador (Playwright + axe) contra o build de produção com PGlite novo
  # em .data/e2e (o webServer do playwright.config.ts cuida de migrar, semear, buildar e subir).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Navegador do Playwright (Chromium)
        run: npx playwright install --with-deps chromium
      - name: Testes E2E (desktop 1280×800 e celular 375×812)
        run: npm run test:e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
