# Nginx na frente do app (porta 3000 em 127.0.0.1).
# Copie para /etc/nginx/sites-available/, troque eventos.exemplo.com.br pelo domínio, ative e rode
#   sudo certbot --nginx -d eventos.exemplo.com.br
# para o HTTPS (o certbot acrescenta os blocos de certificado e o redirecionamento 80 → 443).

server {
    listen 80;
    listen [::]:80;
    server_name eventos.exemplo.com.br;

    # Anexos e plantas até 8 MB (bodySizeLimit das Server Actions é 9 MB).
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # O app usa estes cabeçalhos para a origem das Server Actions, os redirecionamentos do
        # Portal NORTE e o IP do limite de tentativas de login (PROXIES_CONFIAVEIS=1).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 120s;
    }
}
